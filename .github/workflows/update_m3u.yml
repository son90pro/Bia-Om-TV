name: Auto Update M3U BiaOmTV

on:
  scheduled:
    - cron: '0 * * * *' # Chạy tự động mỗi giờ một lần
  workflow_dispatch: # Cho phép bấm chạy thủ công

permissions:
  contents: write

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run generator script
        run: python generator.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add biaom_live.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update BiaOm TV playlist" && git push)
          
